<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Espaço · Planner 2027</title>
<style>
:root {--cream:#fdfaf4;--wine:#b52d57;--pink:#c75172;--muted:#9e6c78;--border:#eed6dc;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;color:var(--wine)}
body{font-family:Georgia,'Times New Roman',serif}
.banner{position:relative;isolation:isolate;overflow:hidden;min-height:212px;width:100%;background:var(--cream);border:1px solid var(--border);border-radius:20px;display:flex;align-items:center;box-shadow:0 2px 8px #a8506612}

.content{width:min(94%,1140px);margin:auto;display:grid;grid-template-columns:1.02fr .98fr;align-items:center;gap:28px;padding:23px 8px}
.side{min-width:0;padding:1px 15px 1px 0}
.side+.side{border-left:1px solid #e6bbc7;padding-left:35px;padding-right:0}
.eyebrow{font:700 10px/1.5 Arial,Helvetica,sans-serif;letter-spacing:.29em;text-transform:uppercase;color:var(--wine);margin-bottom:7px}
h1,h2,p{margin:0}
h1{font-size:clamp(23px,2.8vw,39px);font-weight:400;font-style:italic;line-height:1.14;letter-spacing:-.025em}
h2{font-size:clamp(17px,1.9vw,27px);line-height:1.2;font-weight:400;margin-bottom:10px}
.date{font:12px/1.65 Arial,Helvetica,sans-serif;color:var(--muted);margin-top:10px}
.quote{font-style:italic;font-size:clamp(12px,1.25vw,16px);color:var(--pink);line-height:1.4;margin-top:8px}
.detail{font:12px/1.65 Arial,Helvetica,sans-serif;color:var(--muted);max-width:380px}
.countdown{display:inline-block;font:600 12px/1.4 Arial,Helvetica,sans-serif;color:var(--wine);margin-top:11px;border-bottom:1px solid #e6bbc7;padding-bottom:4px}
@media (max-width:720px){.banner{min-height:255px;border-radius:15px}.content{width:92%;padding:22px 0;display:block}.side{padding:0}.side+.side{border-left:0;border-top:1px solid #e6bbc7;margin-top:15px;padding:13px 0 0}.eyebrow{font-size:9px;letter-spacing:.2em}h1{font-size:26px}h2{font-size:19px;margin-bottom:4px}.date,.detail{font-size:11px}.quote{font-size:12px}.countdown{font-size:11px;margin-top:5px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="banner" aria-label="Banner do Meu Espaço 2027">
 <div class="content">
  <section class="side">
   <div class="eyebrow" id="greeting-label">SEJA BEM-VINDA</div>
   <h1 id="greeting">Bem-vinda ao seu 2027.</h1>
   <p class="date" id="now">Carregando data e horário...</p>
   <p class="quote">Ame a vida que você tem enquanto constrói a vida que você sonha.</p>
  </section>
  <section class="side">
   <div class="eyebrow">SEU ESPAÇO, SEU TEMPO</div>
   <h2>Um ano para florescer,<br>um dia de cada vez.</h2>
   <p class="detail">Seus planos, projetos e sonhos em um só lugar.</p>
   <div class="countdown" id="countdown" aria-live="off">Preparando sua contagem regressiva...</div>
  </section>
 </div>
</main>
<script>
(function(){
 const zone='America/Sao_Paulo';
 const fmtParts=new Intl.DateTimeFormat('en-US',{timeZone:zone,hour:'numeric',hour12:false,year:'numeric',month:'numeric',day:'numeric'});
 function tick(){
  const now=new Date();
  const hour=Number(fmtParts.formatToParts(now).find(p=>p.type==='hour').value)%24;
  const greeting=hour<12?'Bom dia':hour<18?'Boa tarde':'Boa noite';
  document.getElementById('greeting-label').textContent=greeting.toUpperCase()+', QUE BOM TER VOCÊ AQUI';
  document.getElementById('greeting').textContent='Bem-vinda ao seu espaço.';
  const pretty=new Intl.DateTimeFormat('pt-BR',{timeZone:zone,weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(now);
  document.getElementById('now').textContent=pretty.charAt(0).toUpperCase()+pretty.slice(1)+' · horário de Brasília';
  const year=Number(new Intl.DateTimeFormat('en-US',{timeZone:zone,year:'numeric'}).format(now));
  const next=Date.UTC(year+1,0,1,3); // 1 Jan at 00h America/Sao_Paulo (-03:00)
  const days=Math.max(0,Math.ceil((next-now.getTime())/86400000));
  document.getElementById('countdown').textContent=days===1?'Falta 1 dia para '+(year+1):'Faltam '+days+' dias para '+(year+1);
 }
 tick();setInterval(tick,30000);
})();
</script>
</body>
</html>
